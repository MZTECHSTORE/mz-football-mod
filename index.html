<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MZ Football - API-Futebol</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --primary: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 1rem; }
    .container { max-width: 700px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 1.5rem; }
    h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 0.5rem; }
    
    .status-box { background: var(--card-bg); border: 1px solid var(--border); padding: 1rem; border-radius: 10px; text-align: center; color: var(--text-muted); margin-bottom: 1rem; }
    
    .champ-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem; }
    .champ-logo { width: 45px; height: 45px; object-fit: contain; background: #0f172a; padding: 4px; border-radius: 6px; }
    .champ-info h3 { font-size: 1.05rem; color: var(--text-main); margin-bottom: 0.2rem; }
    .champ-info p { font-size: 0.85rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>⚽ MZ Football - Campeonatos</h1>
    </header>

    <div id="statusMessage" class="status-box">A carregar dados da API-Futebol...</div>
    <div id="app"></div>
  </div>

  <script>
    async function carregarCampeonatos() {
      const statusEl = document.getElementById('statusMessage');
      const app = document.getElementById('app');
      
      const url = "https://api.api-futebol.com.br/v1/campeonatos";

      try {
        const response = await fetch(url, {
          headers: {
            Authorization: "Bearer live_17e37542f47c246dcd1dca691bcb54",
            Accept: "application/json"
          },
        });

        if (!response.ok) {
          throw new Error(`Erro HTTP: ${response.status} - ${response.statusText}`);
        }

        const data = await response.json();
        statusEl.style.display = 'none';

        // Suporta diferentes formatos de resposta da API
        const campeonatos = Array.isArray(data) ? data : (data.campeonatos || data.data || []);

        if (campeonatos.length === 0) {
          app.innerHTML = `<div class="status-box">Nenhum campeonato encontrado.</div>`;
          return;
        }

        campeonatos.forEach(c => {
          const nome = c.nome || c.name || "Campeonato";
          const logo = c.logo || c.logotipo || "";
          const formato = c.formato || "N/D";
          const status = c.status || "Ativo";

          app.innerHTML += `
            <div class="champ-card">
              ${logo ? `<img src="${logo}" class="champ-logo" alt="${nome}">` : '<i class="fas fa-trophy fa-2x" style="color: #10b981; min-width:45px; text-align:center;"></i>'}
              <div class="champ-info">
                <h3>${nome}</h3>
                <p>Formato: ${formato} | Estado: ${status}</p>
              </div>
            </div>
          `;
        });

      } catch (error) {
        statusEl.style.background = '#7f1d1d';
        statusEl.style.borderColor = '#f87171';
        statusEl.style.color = '#fecaca';
        statusEl.innerHTML = `<strong>Erro de Ligação:</strong> ${error.message}<br><br><small>Nota: Se o erro persistir, verifique se o seu plano na API-Futebol permite requisições diretas a partir de aplicações frontend (CORS).</small>`;
        console.error(error);
      }
    }

    carregarCampeonatos();
  </script>
</body>
</html>
