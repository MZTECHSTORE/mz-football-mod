<section class="controls-panel">
  <div class="search-box">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="Pesquisar equipa ou liga..." onkeyup="filterMatches()">
  </div>

  <div class="filter-buttons">
    <button id="btn-live" class="filter-btn active" onclick="loadMatches('live')">
      <i class="fas fa-circle live-dot"></i> Ao Vivo
    </button>
    <button id="btn-week" class="filter-btn" onclick="loadMatches('week')">
      <i class="fas fa-calendar-week"></i> Esta Semana
    </button>
    <button id="btn-month" class="filter-btn" onclick="loadMatches('month')">
      <i class="fas fa-calendar-alt"></i> Este Mês
    </button>
  </div>
</section>
