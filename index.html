<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MZ Football - Campeonatos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --primary: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 1rem; }
    .container { max-width: 700px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 1.5rem; }
    h1 { color: var(--primary); font-size: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    
    .status-box { background: var(--card-bg); border: 1px solid var(--border); padding: 1rem; border-radius: 10px; text-align: center; color: var(--text-muted); margin-bottom: 1rem; }
    
    .champ-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem; }
    .champ-logo { width: 40px; height: 40px; object-fit: contain; }
    .champ-info h3 { font-size: 1.1rem; color: var(--text-main); margin-bottom: 0.2rem; }
    .champ-info p { font-size: 0.85rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1><i class="fas fa-trophy"></i> MZ Football - Campeonatos</h1>
    </header>

    <div id="statusMessage" class="status-box">A carregar campeonatos da API-Futebol...</div>
    <div id="champsContainer"></div>
  </div>

  <script>
    const API_TOKEN = 'live_17e37542f47c246dcd1dca691bcb54';
    const API_URL = 'https://api.api-futebol.com.br/v1/campeonatos';

    async function fetchCampeonatos() {
      const statusEl = document.getElementById('statusMessage');
      const containerEl = document.getElementById('champsContainer');

      try {
        // A API-Futebol requer o cabeçalho Authorization com Bearer token
        const response = await fetch(API_URL, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${API_TOKEN}`,
            'Accept': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`Erro HTTP: ${response.status} - ${response.statusText}`);
        }

        const data = await response.json();
        statusEl.style.display = 'none';

        // Adaptação para diferentes estruturas de retorno da API
        const campeonatos = Array.isArray(data) ? data : (data.campeonatos || data.data || []);

        if (campeonatos.length === 0) {
          containerEl.innerHTML = `<div class="status-box">Nenhum campeonato encontrado na resposta da API.</div>`;
          return;
        }

        campeonatos.forEach(champ => {
          const nome = champ.nome || champ.name || "Campeonato Oficial";
          const logo = champ.logo || champ.logotipo || "";
          const formato = champ.formato || "N/D";
          const status = champ.status || "Ativo";

          containerEl.innerHTML += `
            <div class="champ-card">
              ${logo ? `<img src="${logo}" class="champ-logo" alt="${nome}">` : '<i class="fas fa-shield-alt fa-2x" style="color: #10b981;"></i>'}
              <div class="champ-info">
                <h3>${nome}</h3>
                <p>Formato: ${formato} | Estado: ${status}</p>
              </div>
            </div>
          `;
        });

      } catch (error) {
        statusEl.style.background = '#7f1d1d';
        statusEl.style.borderColor = '#f87171';
        statusEl.style.color = '#fecaca';
        statusEl.innerText = `Erro de Ligação: ${error.message}. Certifique-se de que a chave suporta este endpoint ou verifique restrições de CORS.`;
      }
    }

    fetchCampeonatos();
  </script>
</body>
</html>
