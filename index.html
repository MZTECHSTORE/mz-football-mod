<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MZ Football AI Predictor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
background:#0b0b0b;
color:white;
font-family:Arial;
margin:0;
}

header{
background:#111;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
}

.logo{
font-size:22px;
font-weight:bold;
color:#22c55e;
}

nav a{
margin:0 10px;
color:#aaa;
text-decoration:none;
}

.container{
padding:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#111;
border:1px solid #222;
padding:20px;
border-radius:10px;
}

.league{
color:#888;
font-size:14px;
}

.match{
font-size:18px;
font-weight:bold;
margin-top:5px;
}

.prediction{
color:#22c55e;
margin-top:10px;
}

button{
background:#22c55e;
border:none;
padding:10px 20px;
border-radius:5px;
cursor:pointer;
margin-top:10px;
}

.footer{
text-align:center;
padding:20px;
border-top:1px solid #222;
color:#666;
margin-top:40px;
}

</style>
</head>

<body>

<header>

<div class="logo">⚽ MZ Football AI</div>

<nav>
<a href="#">Home</a>
<a href="#">Live</a>
<a href="#">Predictions</a>
<a href="#">VIP</a>
</nav>

</header>

<div class="container">

<h1>Football Predictions Platform</h1>
<p>Professional AI football predictions covering multiple leagues.</p>

<button onclick="loadMatches()">Load Live Matches</button>

<div id="matches" class="grid"></div>

</div>

<div class="footer">
MZ Tech Store Football AI Platform
</div>

<script>

const API_TOKEN = "YOUR_TOKEN"

async function loadMatches(){

const container = document.getElementById("matches")

container.innerHTML="Loading matches..."

try{

const res = await fetch(`https://api.sportmonks.com/v3/football/livescores/inplay?api_token=${API_TOKEN}&include=participants;scores;league`)

const json = await res.json()

container.innerHTML=""

const matches = json.data || []

matches.forEach(match =>{

const home = match.participants?.find(p=>p.meta.location==="home")?.name || "Home"

const away = match.participants?.find(p=>p.meta.location==="away")?.name || "Away"

const league = match.league?.name || "League"

const prediction = predictMatch()

const card = document.createElement("div")

card.className="card"

card.innerHTML = `
<div class="league">${league}</div>
<div class="match">${home} vs ${away}</div>
<div class="prediction">Prediction: ${prediction}</div>
`

container.appendChild(card)

})

}catch(e){

container.innerHTML="Error loading matches"

}

}

function predictMatch(){

const predictions = [
"Home Win",
"Away Win",
"Draw",
"Over 2.5 Goals",
"Under 2.5 Goals",
"Both Teams Score"
]

return predictions[Math.floor(Math.random()*predictions.length)]

}

</script>

</body>
</html>
